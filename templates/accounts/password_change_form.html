{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password - MicroREMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Change Your Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-6">
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                Change Password
            </button>
        </div>
    </form>
    <div class="mt-6 text-center">
        <a href="{% url 'profile' %}" class="text-gray-600 hover:text-gray-800 font-semibold">Cancel</a>
    </div>
</div>
{% endblock %}
