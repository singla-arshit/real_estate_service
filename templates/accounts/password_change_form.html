{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password - MicroREMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-black p-8 rounded-lg border border-gray-800 mt-10">
    <h2 class="text-2xl font-bold text-white text-center mb-6">Change Your Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-6">
            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-dark font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                <i class="fas fa-key mr-2"></i> Change Password
            </button>
        </div>
    </form>
    <div class="mt-6 text-center">
        <a href="{% url 'profile' %}" class="text-gray-400 hover:text-gray-200 font-semibold">
            <i class="fas fa-times mr-1"></i> Cancel
        </a>
    </div>
</div>
{% endblock %}
