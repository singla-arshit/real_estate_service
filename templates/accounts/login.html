{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - MicroREMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-black p-8 rounded-lg border border-gray-800 mt-10">
    <h2 class="text-2xl font-bold text-white text-center mb-6">Login to Your Account</h2>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form|crispy }}
        </div>
        <div class="mt-6">
            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-dark font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </div>
    </form>
    <div class="mt-6 text-center">
        <p class="text-sm text-gray-400">
            <a href="{% url 'password_reset' %}" class="font-medium text-orange-500 hover:text-orange-600">
                <i class="fas fa-key mr-1"></i> Forgot your password?
            </a>
        </p>
        <p class="mt-2 text-sm text-gray-400">
            Don't have an account? 
            <a href="{% url 'register' %}" class="font-medium text-orange-500 hover:text-orange-600">
                <i class="fas fa-user-plus mr-1"></i> Sign up here
            </a>
        </p>
    </div>
</div>
{% endblock %}
