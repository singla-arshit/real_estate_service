{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - MicroREMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Login to Your Account</h2>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form|crispy }}
        </div>
        <div class="mt-6">
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                Login
            </button>
        </div>
    </form>
    <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
            <a href="{% url 'password_reset' %}" class="font-medium text-indigo-600 hover:text-indigo-500">
                Forgot your password?
            </a>
        </p>
        <p class="mt-2 text-sm text-gray-600">
            Don't have an account? 
            <a href="{% url 'register' %}" class="font-medium text-indigo-600 hover:text-indigo-500">
                Sign up here
            </a>
        </p>
    </div>
</div>
{% endblock %}
