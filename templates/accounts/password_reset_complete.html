{% extends 'base.html' %}

{% block title %}Password Reset Complete - MicroREMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-black p-8 rounded-lg border border-gray-800 mt-10 text-center">
    <h2 class="text-2xl font-bold text-white mb-6">Password Reset Complete</h2>
    <p class="text-gray-400 mb-6">
        Your password has been set. You can now log in with your new password.
    </p>
    <div class="mt-6">
        <a href="{% url 'login' %}" class="w-full inline-block bg-orange-500 hover:bg-orange-600 text-dark font-bold py-3 px-6 rounded-lg transition duration-150 ease-in-out">
            <i class="fas fa-sign-in-alt mr-2"></i> Log in
        </a>
    </div>
</div>
{% endblock %}
