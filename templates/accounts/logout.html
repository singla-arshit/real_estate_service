{% extends 'base.html' %}

{% block title %}Logged Out - MicroREMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10 text-center">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">You have been logged out.</h2>
    <p class="text-gray-600 mb-6">
        Thank you for using Micro Real Estate Management. 
    </p>
    <div class="space-y-4">
        <a href="{% url 'login' %}" class="w-full inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-150 ease-in-out">
            Login Again
        </a>
        <a href="{% url 'home' %}" class="w-full inline-block bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg transition duration-150 ease-in-out">
            Go to Homepage
        </a>
    </div>
</div>
{% endblock %}
