{% extends 'base.html' %}

{% block title %}Contact Us - MicroREMS{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-black p-8 rounded-lg border border-gray-800 mt-10">
    <h1 class="text-3xl font-bold text-white text-center mb-8">Contact Us</h1>
    
    <div class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <h2 class="text-2xl font-bold text-white mb-4">Get in Touch</h2>
                <div class="space-y-4">
                    <p class="text-gray-400">
                        <i class="fas fa-envelope mr-2"></i>
                        Email: support@microrems.com
                    </p>
                    <p class="text-gray-400">
                        <i class="fas fa-phone mr-2"></i>
                        Phone: +1 (555) 123-4567
                    </p>
                    <p class="text-gray-400">
                        <i class="fas fa-clock mr-2"></i>
                        Support Hours: Mon-Fri, 9 AM - 5 PM
                    </p>
                </div>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-white mb-4">Send us a Message</h2>
                <form class="space-y-4">
                    <div>
                        <input type="text" placeholder="Your Name" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div>
                        <input type="email" placeholder="Your Email" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div>
                        <textarea placeholder="Your Message" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" rows="4"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-dark font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
